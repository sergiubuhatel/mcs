# Fronts the backend container: nginx is the only public-facing listener,
# reverse-proxying everything to Waitress (the actual WSGI app server)
# bound to localhost only. Kept as plain HTTP/1.1 proxying -- this app's
# Socket.IO async_mode is "threading", so it only ever uses the polling
# transport (plain HTTP requests), not a true WebSocket upgrade; the
# Upgrade headers below are harmless to keep in case that ever changes.
server {
    listen 5000;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
