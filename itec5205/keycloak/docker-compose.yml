version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    container_name: keycloak-https
    command:
      - start
      - --https-key-store-file=/etc/x509/https/keycloak.keystore.jks
      - --https-key-store-password=Keycloak
    ports:
      - "9090:8443"
    environment:
      KC_HOSTNAME: 10.152.0.202
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    depends_on:
      - postgres
    volumes:
      - ./:/etc/x509/https/:z
      - ./themes:/opt/keycloak/themes:ro,z
    restart: unless-stopped

volumes:
  postgres_data: