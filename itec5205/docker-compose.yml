services:
  arangodb:
    image: arangodb:3.11
    container_name: itec5205-arangodb
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-root}
    ports:
      - "8529:8529"
    volumes:
      - C:/docker-data/arangodb:/var/lib/arangodb3

  redis:
    image: redis:7-alpine
    container_name: itec5205-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: itec5205-backend
    restart: unless-stopped
    depends_on:
      - arangodb
      - redis
    environment:
      ARANGO_HOST: http://arangodb:8529
      ARANGO_DB: investing
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-root}
      REDIS_URL: redis://redis:6379/0
      TICKERS_FILE: /data/tickers.txt
      RL_MODELS_DIR: /data/rl_models
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - ./tickers.txt:/data/tickers.txt:ro
      - rl_models:/data/rl_models

  worker-import:
    build: ./backend
    container_name: itec5205-worker-import
    restart: unless-stopped
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q import -n import@%h
    depends_on:
      - arangodb
      - redis
    environment:
      ARANGO_HOST: http://arangodb:8529
      ARANGO_DB: investing
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-root}
      REDIS_URL: redis://redis:6379/0
      TICKERS_FILE: /data/tickers.txt
      RL_MODELS_DIR: /data/rl_models
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./tickers.txt:/data/tickers.txt:ro
      - rl_models:/data/rl_models

  worker-rl:
    build: ./backend
    container_name: itec5205-worker-rl
    restart: unless-stopped
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q rl -n rl@%h
    depends_on:
      - arangodb
      - redis
    environment:
      ARANGO_HOST: http://arangodb:8529
      ARANGO_DB: investing
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-root}
      REDIS_URL: redis://redis:6379/0
      TICKERS_FILE: /data/tickers.txt
      RL_MODELS_DIR: /data/rl_models
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./tickers.txt:/data/tickers.txt:ro
      - rl_models:/data/rl_models

  worker-predict:
    build: ./backend
    container_name: itec5205-worker-predict
    restart: unless-stopped
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q predict -n predict@%h
    depends_on:
      - arangodb
      - redis
    environment:
      ARANGO_HOST: http://arangodb:8529
      ARANGO_DB: investing
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-root}
      REDIS_URL: redis://redis:6379/0
      TICKERS_FILE: /data/tickers.txt
      RL_MODELS_DIR: /data/rl_models
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./tickers.txt:/data/tickers.txt:ro
      - rl_models:/data/rl_models

  flower:
    build: ./backend
    container_name: itec5205-flower
    restart: unless-stopped
    command: celery -A celery_worker.celery_app flower --port=5555
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"

  frontend:
    build: ./frontend
    container_name: itec5205-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  redis_data:
  rl_models:
