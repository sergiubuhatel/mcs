# One-shot launch of the whole stack:  docker compose up -d --build
# Startup order: arangodb + redis -> init-db (creates collections, then exits)
# -> backend + the five Celery workers -> frontend.

# Settings shared by every service built from ./backend (API, workers, init).
x-backend-env: &backend-env
  ARANGO_HOST: http://arangodb:8529
  ARANGO_DB: investing
  ARANGO_USER: root
  ARANGO_PASSWORD: ${ARANGO_PASSWORD:-root}
  REDIS_URL: redis://redis:6379/0
  TICKERS_FILE: /data/tickers.txt
  RUSSELL3000_FILE: /data/russell3000.txt
  RL_MODELS_DIR: /data/rl_models
  # Add your public https://... hostname via .env when using the tunnel.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
  # One math thread per process: workers run several processes side by side,
  # and PyTorch/NumPy default to one thread per CPU core each.
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

# Only `backend` builds the image; the workers/init-db/flower reuse it.
# Building it once per service in parallel (7 identical PyTorch builds)
# exhausted Docker Desktop's memory and crashed the engine.
x-backend: &backend
  image: itec5205-backend
  pull_policy: never
  restart: unless-stopped
  environment: *backend-env
  volumes:
    - ./tickers.txt:/data/tickers.txt:ro
    - ./russell3000.txt:/data/russell3000.txt:ro
    - rl_models:/data/rl_models
  depends_on:
    redis:
      condition: service_healthy
    init-db:
      condition: service_completed_successfully

services:
  arangodb:
    image: arangodb:3.11
    container_name: itec5205-arangodb
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-root}
    ports:
      - "8529:8529"
    volumes:
      - C:/docker-data/arangodb:/var/lib/arangodb3

  redis:
    image: redis:7-alpine
    container_name: itec5205-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Waits for ArangoDB, creates the database/collections/indexes (idempotent), exits.
  init-db:
    image: itec5205-backend
    pull_policy: never
    container_name: itec5205-init-db
    restart: "no"
    command: python scripts/init_db.py
    environment: *backend-env
    depends_on:
      - arangodb

  backend:
    <<: *backend
    build: ./backend
    pull_policy: build
    container_name: itec5205-backend
    ports:
      - "5000:5000"

  # One Celery worker per queue (see task_routes in backend/app/tasks/celery_app.py).
  # Explicit --concurrency: Celery's prefork default is one process per CPU
  # core (16 here), each loading PyTorch -- that exhausted Docker's memory.
  # Raise it via .env (e.g. LSTM_CONCURRENCY=4), or scale containers out
  # (no container_name, so: docker compose up -d --scale worker-lstm=3).
  worker-import:
    <<: *backend
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q import -n import@%h --concurrency=${IMPORT_CONCURRENCY:-1}

  worker-rl:
    <<: *backend
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q rl -n rl@%h --concurrency=${RL_CONCURRENCY:-1}

  worker-lstm:
    <<: *backend
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q lstm -n lstm@%h --concurrency=${LSTM_CONCURRENCY:-2}

  worker-arima:
    <<: *backend
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q arima -n arima@%h --concurrency=${ARIMA_CONCURRENCY:-4}

  # Runs workflows (screen -> forecast -> RL): mostly waits on the jobs it
  # queues on the lstm/arima/rl workers, so a few at once are cheap.
  worker-workflow:
    <<: *backend
    command: celery -A celery_worker.celery_app worker --loglevel=info -Q workflow -n workflow@%h --concurrency=${WORKFLOW_CONCURRENCY:-2}

  flower:
    image: itec5205-backend
    pull_policy: never
    container_name: itec5205-flower
    restart: unless-stopped
    command: celery -A celery_worker.celery_app flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      backend:
        condition: service_started

  # ---- Keycloak (login) -------------------------------------------------
  # Served by the frontend nginx under /auth, so the same URL works locally
  # (http://localhost:8080/auth) and through the tunnel; admin console at
  # /auth/admin. Realms: master (Keycloak admins) and Carleton (app users).
  keycloak-db:
    image: postgres:15
    container_name: itec5205-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Converts keycloak/backup_initial_settings into import files (renames the
  # realm to Carleton, sets the Carleton login theme), then exits. Keycloak
  # imports them only into an empty database (existing realms are skipped).
  keycloak-import:
    image: itec5205-backend
    pull_policy: never
    container_name: itec5205-keycloak-import
    restart: "no"
    command: python /keycloak/prepare_import.py /keycloak/backup_initial_settings /import
    volumes:
      - ./keycloak:/keycloak:ro
      - keycloak_import:/import
    depends_on:
      backend:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    container_name: itec5205-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # Hostname comes from the request (localhost:8080 or the tunnel host);
      # nginx passes X-Forwarded-Proto/Host so tunnel URLs are https.
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Single node: no cluster discovery (it waits ~20 s for stale nodes).
      KC_CACHE: local
      # No KC_BOOTSTRAP_ADMIN_*: the imported master realm already has its
      # admins, and a second "admin" makes the first start abort.
    ports:
      - "9090:8080"
    volumes:
      - keycloak_import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-import:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: itec5205-frontend
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      backend:
        condition: service_started
        # Recreating backend changes its IP; restarting frontend makes nginx
        # re-resolve it (otherwise /api/* returns 502).
        restart: true
      worker-import:
        condition: service_started
      worker-rl:
        condition: service_started
      worker-lstm:
        condition: service_started
      worker-arima:
        condition: service_started
      worker-workflow:
        condition: service_started
    ports:
      - "8080:80"

  # Cloudflare Tunnel (optional): publishes only the frontend over HTTPS.
  # Off by default; start with  docker compose --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env (Zero Trust > Networks > Tunnels).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: itec5205-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  redis_data:
  rl_models:
  keycloak_db:
  keycloak_import:
